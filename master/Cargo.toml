[package]
name = "master"
version = "0.1.0"
edition = "2021"

[lib]
name = "master"
path = "src/lib.rs"

[[bin]]
name = "master"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
common = { path = "../common" }
uuid = { version = "1.6", features = ["v4", "serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

