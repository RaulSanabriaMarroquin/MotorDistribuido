[package]
name = "tests"
version = "0.1.0"
edition = "2021"

[[test]]
name = "integration_tests"
path = "integration_tests.rs"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
common = { path = "../common" }
worker = { path = "../worker" }
uuid = { version = "1.6", features = ["v4", "serde"] }

